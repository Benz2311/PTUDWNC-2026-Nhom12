# =============================================================================
# CULINARY BLOG - DOCKER COMPOSE DEVELOPMENT (SRS v1.2.0 Mục 6.5)
# Hệ thống đầy đủ 8 dịch vụ: Postgres, Redis, MinIO, API, Web, Nginx, Seq, MailHog
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culinaryblog}
      POSTGRES_USER: ${POSTGRES_USER:-culinaryadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-culinaryadmin} -d ${POSTGRES_DB:-culinaryblog}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - culinary-network

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - culinary-network

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks:
      - culinary-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CONFIGURATION: Debug
    image: culinaryblog-api:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Site__PublicBaseUrl: "${PUBLIC_ORIGIN:-http://localhost:${NGINX_PORT:-80}}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-culinaryblog};Username=${POSTGRES_USER:-culinaryadmin};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Storage__ServiceUrl: "http://minio:9000"
      Storage__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      Storage__DefaultBucket: ${MINIO_DEFAULT_BUCKET:-culinaryblog}
      Storage__InitializeBucket: "true"
      Email__Host: "mailhog"
      Email__Port: 1025
      Serilog__WriteTo__2__Args__serverUrl: "http://seq:80"
      Database__AutoMigrateAndSeed: "${DATABASE_AUTO_MIGRATE:-false}"
      GoogleAuth__ClientId: "${GOOGLE_CLIENT_ID:-}"
      GoogleAuth__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - culinary-network

  frontend:
    build:
      context: ./frontend/culinary-blog-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8088/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: culinaryblog-web:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8088/api/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      INTERNAL_API_URL: http://api:8080/api/v1
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:${NGINX_PORT:-80}}"
    depends_on:
      - api
    networks:
      - culinary-network

  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - culinary-network

  seq:
    image: datalust/seq:latest
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:${SEQ_PORT:-5341}:80"
    volumes:
      - seqdata:/data
    networks:
      - culinary-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${CONTAINER_PREFIX:-culinaryblog}-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - culinary-network

volumes:
  pgdata:
    name: ${VOLUME_PREFIX:-culinaryblog}_pgdata
  redisdata:
    name: ${VOLUME_PREFIX:-culinaryblog}_redisdata
  miniodata:
    name: ${VOLUME_PREFIX:-culinaryblog}_miniodata
  seqdata:
    name: ${VOLUME_PREFIX:-culinaryblog}_seqdata

networks:
  culinary-network:
    name: ${NETWORK_NAME:-culinaryblog_network}
    driver: bridge
